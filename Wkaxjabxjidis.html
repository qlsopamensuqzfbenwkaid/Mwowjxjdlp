<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Sports Channels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1d26; --panel:#11303d; --line:#1f4757; --chalk:#f3f1e7; --mute:#8fb0bd;
  --amber:#ffb703; --live:#ff4d3a; --tile:#f3f1e7;
  --disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--body);color:var(--chalk);background:var(--bg);min-height:100vh;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* player */
.stage{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--line)}
.stage-inner{max-width:980px;margin:0 auto;position:relative}
.screen{position:relative;aspect-ratio:16/9;max-height:52vh;width:100%;margin:0 auto;background:#000;display:grid;place-items:center}
video{width:100%;height:100%;background:#000;display:block}
.idle,.status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:10px;padding:16px;pointer-events:none}
.idle{font-family:var(--disp);font-size:clamp(22px,4vw,34px);font-weight:500;color:var(--mute)}
.status{background:rgba(0,0,0,.55);font-size:15px}
.status[hidden],.idle[hidden]{display:none}
.status button{pointer-events:auto;justify-self:center;background:var(--amber);color:#1a1200;border:0;border-radius:999px;padding:8px 20px;font-weight:500;cursor:pointer}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--amber);border-radius:50%;margin:0 auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.now{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px}
.now img,.now .ph{width:36px;height:36px;border-radius:50%;background:var(--tile);object-fit:contain;padding:3px;flex:none}
.now .ph{display:grid;place-items:center;color:#10303d;font-family:var(--disp);font-weight:700}
.now h2{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1.1}
.now small{color:var(--mute);font-size:13px}
.badge{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:15px;background:var(--live);color:#fff;padding:2px 10px;border-radius:999px}
.badge[hidden]{display:none}

/* controls */
.bar{max-width:1200px;margin:0 auto;padding:18px 14px 8px}
.search{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-size:16px}
.search::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--mute);font-size:14px}
.chip[aria-pressed=true]{background:var(--chalk);color:#0b1d26;border-color:var(--chalk)}
.count{color:var(--mute);font-size:13px;padding:6px 0 0}

/* grid */
main{max-width:1200px;margin:0 auto;padding:8px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:22px 10px}
.ch{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:2px}
.logo{position:relative;width:78px;height:78px;border-radius:50%;background:var(--tile);display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line);transition:box-shadow .15s,transform .15s}
.logo img{width:100%;height:100%;object-fit:contain;padding:11px;border-radius:50%}
.logo .ini{font-family:var(--disp);font-weight:700;font-size:26px;color:#10303d}
.ch:hover .logo{transform:scale(1.06);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--mute)}
.ch[aria-current=true] .logo{box-shadow:0 0 0 2px var(--bg),0 0 0 5px var(--amber)}
.ch.dead{opacity:.35}
.name{font-size:13px;line-height:1.25;color:var(--chalk);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.empty{padding:50px 0;color:var(--mute);font-family:var(--disp);font-size:24px}
@media (min-width:700px){.logo{width:92px;height:92px}.grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>

<section class="stage" aria-label="Player">
  <div class="stage-inner">
    <div class="screen">
      <video id="v" controls playsinline autoplay></video>
      <div class="idle" id="idle">Pick a channel to start watching</div>
      <div class="status" id="status" hidden></div>
    </div>
    <div class="now" id="now" hidden>
      <div id="nowLogo"></div>
      <div><h2 id="nowName"></h2><small id="nowMeta"></small></div>
      <span class="badge" id="live" hidden>LIVE</span>
    </div>
  </div>
</section>

<div class="bar">
  <input class="search" id="q" type="search" placeholder="Search channels" autocomplete="off" aria-label="Search channels">
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <div class="count" id="count"></div>
</div>

<main><div class="grid" id="grid"></div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const v = $('v'), grid = $('grid'), statusEl = $('status');
  let hls = null, dash = null, ts = null, token = 0, current = -1, timer = 0;
  const dead = new Set();
  let cat = 'All', term = '';

  /* ---------- list ---------- */
  const initials = n => (n.replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('') || '?').toUpperCase();

  function logoNode(c, cls){
    const wrap = document.createElement('div');
    if (cls) wrap.className = cls;
    const ph = () => { wrap.textContent=''; const s=document.createElement('span'); s.className='ini'; s.textContent=initials(c.n); wrap.appendChild(s); };
    if (!c.l) { ph(); return wrap; }
    const img = new Image();
    img.alt=''; img.loading='lazy'; img.decoding='async'; img.referrerPolicy='no-referrer';
    img.onerror = ph;
    img.src = c.l;
    wrap.appendChild(img);
    return wrap;
  }

  function render(){
    const t = term.trim().toLowerCase();
    const list = [];
    CHANNELS.forEach((c,i) => {
      if (cat !== 'All' && !c.g.includes(cat)) return;
      if (t && !c.n.toLowerCase().includes(t)) return;
      list.push(i);
    });
    grid.textContent = '';
    const frag = document.createDocumentFragment();
    list.forEach(i => {
      const c = CHANNELS[i];
      const b = document.createElement('button');
      b.className = 'ch' + (dead.has(i) ? ' dead' : '');
      b.dataset.i = i;
      b.title = c.n;
      if (i === current) b.setAttribute('aria-current','true');
      b.appendChild(logoNode(c,'logo'));
      const n = document.createElement('span'); n.className='name'; n.textContent=c.n;
      b.appendChild(n);
      frag.appendChild(b);
    });
    grid.appendChild(frag);
    if (!list.length) { const e=document.createElement('div'); e.className='empty'; e.textContent='No channels match'; grid.appendChild(e); }
    $('count').textContent = list.length + ' of ' + CHANNELS.length + ' channels';
  }

  function buildChips(){
    const counts = {};
    CHANNELS.forEach(c => c.g.forEach(g => counts[g]=(counts[g]||0)+1));
    const names = ['All', ...Object.keys(counts).sort((a,b)=>counts[b]-counts[a])];
    const box = $('chips');
    names.forEach(n => {
      const b = document.createElement('button');
      b.className='chip'; b.textContent = n==='All' ? 'All' : n + ' ' + counts[n];
      b.setAttribute('aria-pressed', n===cat);
      b.onclick = () => { cat = n; [...box.children].forEach((x,k)=>x.setAttribute('aria-pressed', names[k]===cat)); render(); };
      box.appendChild(b);
    });
  }

  /* warm up the connection to a stream's server before the click lands */
  const warmed = new Set();
  function warm(i){
    const c = CHANNELS[i]; if(!c || warmed.has(i)) return; warmed.add(i);
    try { const o = new URL(c.u).origin; const l=document.createElement('link'); l.rel='preconnect'; l.href=o; document.head.appendChild(l); } catch(e){}
  }
  grid.addEventListener('pointerover', e => { const b=e.target.closest('.ch'); if(b) warm(+b.dataset.i); });
  grid.addEventListener('touchstart', e => { const b=e.target.closest('.ch'); if(b) warm(+b.dataset.i); }, {passive:true});
  grid.addEventListener('click', e => { const b=e.target.closest('.ch'); if(b) play(+b.dataset.i); });

  /* ---------- player ---------- */
  function setStatus(html, retry){
    statusEl.textContent='';
    if (html === null) { statusEl.hidden = true; return; }
    if (html === 'spin') { const s=document.createElement('div'); s.className='spin'; statusEl.appendChild(s); const p=document.createElement('div'); p.textContent='Starting stream…'; statusEl.appendChild(p); }
    else { const p=document.createElement('div'); p.textContent=html; statusEl.appendChild(p); }
    if (retry) { const b=document.createElement('button'); b.textContent='Try again'; b.onclick=()=>play(current,true); statusEl.appendChild(b); }
    statusEl.hidden = false;
  }

  function teardown(){
    clearTimeout(timer);
    if (hls) { try{hls.destroy()}catch(e){} hls=null; }
    if (dash) { try{dash.reset()}catch(e){} dash=null; }
    if (ts) { try{ts.destroy()}catch(e){} ts=null; }
    v.pause(); v.removeAttribute('src'); v.load();
  }

  function loadScript(src){
    return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
  }

  function fail(my, msg){
    if (my !== token) return;
    clearTimeout(timer);
    dead.add(current);
    const b = grid.querySelector('.ch[data-i="'+current+'"]'); if (b) b.classList.add('dead');
    setStatus(msg || 'This channel is not responding right now.', true);
  }

  async function play(i, force){
    if (i === current && !force && !v.paused) return;
    const c = CHANNELS[i]; if (!c) return;
    const my = ++token;
    current = i;
    teardown();
    dead.delete(i);

    // header
    $('idle').hidden = true;
    $('now').hidden = false;
    $('nowName').textContent = c.n;
    $('nowMeta').textContent = [c.g.join(', '), c.q].filter(Boolean).join('  ·  ');
    const nl = $('nowLogo'); nl.textContent=''; nl.appendChild(logoNode(c,'ph'));
    $('live').hidden = true;
    grid.querySelectorAll('.ch[aria-current]').forEach(x=>x.removeAttribute('aria-current'));
    const btn = grid.querySelector('.ch[data-i="'+i+'"]'); if (btn) { btn.setAttribute('aria-current','true'); btn.classList.remove('dead'); }
    window.scrollTo({top:0,behavior:'smooth'});
    setStatus('spin');

    if (location.protocol === 'https:' && c.u.startsWith('http://')) {
      return fail(my, 'This stream is plain http and the browser blocks it on a secure (https) page. Open the file locally or host it over http.');
    }

    const url = c.u, lower = url.toLowerCase();
    v.muted = false;
    timer = setTimeout(() => fail(my, 'Taking too long. The stream may be offline or blocked.'), 15000);

    const started = () => { if (my!==token) return; clearTimeout(timer); setStatus(null); $('live').hidden = false; };
    v.onplaying = started;
    v.onwaiting = () => { if (my===token && !v.paused && v.readyState<3) { /* short stalls: keep UI quiet */ } };

    const tryPlay = () => { const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(()=>{}); }); };

    try {
      if (lower.includes('.mpd')) {
        if (!window.dashjs) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js');
        if (my!==token) return;
        dash = dashjs.MediaPlayer().create();
        dash.updateSettings({streaming:{buffer:{fastSwitchEnabled:true,bufferTimeAtTopQuality:20},abr:{autoSwitchBitrate:{video:true}}}});
        dash.initialize(v, url, true);
        dash.on('error', () => fail(my));
      } else if (lower.includes('.m3u8') || lower.includes('m3u8?')) {
        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({
            enableWorker:true, lowLatencyMode:false,
            startLevel:0,                 // begin on the lowest quality = fastest first frame, ABR climbs after
            capLevelToPlayerSize:true,    // don't waste bandwidth above the player size
            startFragPrefetch:true,
            maxBufferLength:20, maxMaxBufferLength:40, backBufferLength:15,
            liveSyncDurationCount:3, liveMaxLatencyDurationCount:8,
            manifestLoadingTimeOut:8000, manifestLoadingMaxRetry:2,
            levelLoadingTimeOut:8000, levelLoadingMaxRetry:3,
            fragLoadingTimeOut:12000, fragLoadingMaxRetry:4,
            nudgeMaxRetry:6
          });
          let netRetry = 0, mediaRetry = 0;
          hls.on(Hls.Events.ERROR, (_, d) => {
            if (!d.fatal) return;
            if (d.type === Hls.ErrorTypes.NETWORK_ERROR && netRetry < 2 && d.details !== 'manifestLoadError') { netRetry++; hls.startLoad(); }
            else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetry < 2) { mediaRetry++; hls.recoverMediaError(); }
            else fail(my);
          });
          hls.loadSource(url);
          hls.attachMedia(v);
          hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
        } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
          v.src = url; v.onerror = () => fail(my); tryPlay();
        } else return fail(my, 'This browser cannot play HLS streams.');
      } else {
        // raw MPEG-TS / direct streams
        if (!window.mpegts) { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.js'); } catch(e){} }
        if (my!==token) return;
        if (window.mpegts && mpegts.isSupported() && !lower.endsWith('.mp4')) {
          ts = mpegts.createPlayer({type:'mpegts', isLive:true, url}, {enableWorker:true, liveBufferLatencyChasing:true, liveBufferLatencyMaxLatency:6, liveBufferLatencyMinRemain:1});
          ts.attachMediaElement(v);
          ts.on(mpegts.Events.ERROR, () => fail(my));
          ts.load(); tryPlay();
        } else { v.src = url; v.onerror = () => fail(my); tryPlay(); }
      }
    } catch(e) { fail(my); }
  }

  /* ---------- search ---------- */
  let st = 0;
  $('q').addEventListener('input', e => { term = e.target.value; clearTimeout(st); st = setTimeout(render, 120); });

  buildChips();
  render();
})();
</script>
