<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at top,#0f172a 0%,#030712 70%) fixed;background-color:#030712;color:#fff;min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding-bottom:40px}

.top{position:sticky;top:0;z-index:30;background:rgba(3,7,18,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,242,254,.2);padding:12px 16px 8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.brand b{font-size:20px;font-weight:700;letter-spacing:.5px}
.brand span{font-size:9px;letter-spacing:1.5px;color:#94a3b8}
.loadbtn{margin-left:auto;background:transparent;border:1px solid rgba(0,242,254,.5);color:#00f2fe;border-radius:999px;padding:4px 12px;font-size:11px;cursor:pointer}
.loader{grid-column:1/-1;max-width:520px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.loader h3{font-size:16px}.loader p{font-size:12px;color:#94a3b8;line-height:1.6}
.loader textarea{width:100%;height:110px;background:#0f172a;border:1px solid rgba(0,242,254,.4);border-radius:10px;color:#fff;padding:10px;font-size:11px;resize:vertical;outline:none}
.loader .go{background:#00f2fe;color:#030712;border:0;border-radius:999px;padding:8px 22px;font-weight:600;font-size:12px;cursor:pointer}
.loader .go.alt{background:transparent;color:#00f2fe;border:1px solid #00f2fe}
.search{width:100%;max-width:460px;background:#0f172a;border:1px solid #00f2fe;border-radius:20px;padding:8px 16px;color:#fff;font-size:13px;outline:none}
.search::placeholder{color:#64748b}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid rgba(255,255,255,.15);color:#94a3b8;border-radius:999px;padding:4px 13px;font-size:11px;cursor:pointer}
.chip[aria-pressed=true]{background:#00f2fe;border-color:#00f2fe;color:#030712;font-weight:600}
.count{font-size:10px;color:#64748b;padding:2px 2px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:14px 16px}
.channel-card{position:relative;background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:transform .2s,border-color .2s;min-width:0}
.channel-card:hover{transform:translateY(-2px);border-color:#00f2fe}
.channel-card.dead{opacity:.4}
.thumb-wrap{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden;background:#111827;flex-shrink:0;border:2px solid rgba(0,242,254,.55);box-shadow:0 0 10px rgba(0,242,254,.25)}
.thumb-bg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);object-fit:cover;filter:blur(12px) brightness(.55) saturate(1.3)}
.card-thumb{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;object-position:center;padding:15%;display:block}
.ini{position:relative;z-index:1;width:100%;height:100%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#00f2fe}
.channel-logo-text{font-size:10.5px;font-weight:600;text-align:center;line-height:1.2;width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 4px}
.channel-footer{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:8px;padding:0 4px}
.live-badge{background:#ff0055;color:#fff;padding:2px 5px;border-radius:3px;font-weight:700;font-size:7px}
.view-count{color:#94a3b8}
.empty-msg{padding:30px 16px;font-size:13px;color:#94a3b8;grid-column:1/-1}

/* ---- player modal: same as index.html ---- */
.player-modal{position:sticky;top:0;background:#000;z-index:150;display:none;flex-direction:column;border-bottom:1px solid rgba(0,242,254,.3)}
.player-modal.active{display:flex}
.player-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(3,7,18,.95);border-bottom:1px solid rgba(0,242,254,.2);flex-shrink:0}
.player-title{font-size:13px;font-weight:700;color:#00f2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%}
.player-close{color:#fff;font-size:16px;cursor:pointer;background:#ff0055;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-body{position:relative;background:#000;width:100%;aspect-ratio:16/9;max-height:45vh}
body.playing .top{position:static}
.channel-card.playing{border-color:#00f2fe;box-shadow:0 0 12px rgba(0,242,254,.45)}
.player-body>video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.player-body .video-js{position:absolute;inset:0;width:100%;height:100%;background-color:#000}

.toast-popup{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-15px);background:rgba(15,23,42,.95);border:1px solid #00f2fe;color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;box-shadow:0 5px 15px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.3s;z-index:300;max-width:90vw;text-align:center}
.toast-popup.show{opacity:1;transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid #00f2fe;outline-offset:2px}
@media (min-width:700px){.thumb-wrap{width:88px;height:88px}.grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}}
</style>
</head>

let playerInstance = null;
let playerOpen = false, pushedState = false;
let cat = 'All', term = '';
const dead = new Set();

function esc(str){return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeImg(url){return esc(url||PLACEHOLDER);}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toastPopup'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

/* ---------------- PLAYER (index.html wala same player) ---------------- */
let hls = null, triedNative = false;
function destroyHls(){ if (hls) { try { hls.destroy(); } catch(e){} hls = null; } }
function initHlsPlayer(){
  const v = document.getElementById('videoPlayer');
  v.addEventListener('error', () => {
    if (!v.getAttribute('src')) return;
    if (window.currentIdx != null) markDead(window.currentIdx);
    showToast('Stream error: link offline, blocked ya geo-restricted ho sakta hai');
  });
  playerInstance = {
    pause(){ v.pause(); },
    reset(){ destroyHls(); v.pause(); v.removeAttribute('src'); v.load(); }
  };
}

function detectType(url){
  const u = url.split('?')[0].split('#')[0].toLowerCase();
  if (u.endsWith('.mp4') || u.endsWith('.m4v')) return 'video/mp4';
  if (u.endsWith('.webm')) return 'video/webm';
  if (u.endsWith('.ogv') || u.endsWith('.ogg')) return 'video/ogg';
  if (u.endsWith('.mkv')) return 'video/webm';
  if (u.endsWith('.mpd')) return 'application/dash+xml';
  // .m3u8, and also links with no extension (most live TV / IPTV links) are treated as HLS
  return 'application/x-mpegURL';
}

function playStreamHls(url, title){
  url = (url || '').trim();
  if (!url) { showToast('Stream URL not available!'); return; }
  document.getElementById('playerTitle').innerText = title || 'Live Stream';
  document.getElementById('playerModal').classList.add('active');
  document.body.classList.add('playing');
  if (!playerOpen) {
    playerOpen = true;
    try { history.pushState({player:1}, ''); pushedState = true; } catch(e) { pushedState = false; }
  }
  window.scrollTo({top:0, behavior:'smooth'});
  const v = document.getElementById('videoPlayer');
  playerInstance.reset();
  triedNative = false;
  const type = detectType(url);
  const tryPlay = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
  const playNative = () => { v.src = url; v.load(); tryPlay(); };

  if (type !== 'application/x-mpegURL') { playNative(); return; }   // mp4 / webm etc.

  if (window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: false, lowLatencyMode: false, maxBufferLength: 30, manifestLoadingMaxRetry: 2, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3 });
    const myHls = hls;
    hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
    hls.on(Hls.Events.ERROR, (ev, d) => {
      if (!d.fatal || hls !== myHls) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { myHls.recoverMediaError(); return; }
      // network / manifest problem: ek baar browser ke native player se koshish
      destroyHls();
      if (!triedNative && v.canPlayType('application/vnd.apple.mpegurl')) { triedNative = true; playNative(); return; }
      if (window.currentIdx != null) markDead(window.currentIdx);
      showToast('Stream error: link offline, blocked (CORS) ya geo-restricted ho sakta hai');
    });
    hls.loadSource(url);
    hls.attachMedia(v);
  } else {
    playNative();   // Safari / native HLS
  }
}

let useVjs = false;
function initPlayer(){
  if (typeof videojs === 'undefined') { useVjs = false; initHlsPlayer(); return; }
  playerInstance = videojs('videoPlayer', {
    fill: true, controls: true, autoplay: false, preload: 'auto', playsinline: true,
    html5: {
      vhs: { overrideNative: true, enableLowInitialPlaylist: true, smoothQualityChange: true, withCredentials: false },
      nativeAudioTracks: false, nativeVideoTracks: false
    }
  });
  useVjs = true;
  playerInstance.on('error', () => {
    const err = playerInstance.error();
    if (err) {
      console.error('Player error:', err);
      if (window.currentIdx != null) markDead(window.currentIdx);
      showToast('Stream error: link may be offline, blocked (CORS) or http on https');
    }
  });
}

function playStream(url, title){
  if (!useVjs) { playStreamHls(url, title); return; }
  url = (url || '').trim();
  if (!url) { showToast('Stream URL not available!'); return; }
  document.getElementById('playerTitle').innerText = title || 'Live Stream';
  document.getElementById('playerModal').classList.add('active');
  document.body.classList.add('playing');
  if (!playerOpen) {
    playerOpen = true;
    try { history.pushState({player:1}, ''); pushedState = true; } catch(e) { pushedState = false; }
  }
  window.scrollTo({top:0, behavior:'smooth'});
  playerInstance.pause();
  playerInstance.reset();
  playerInstance.src({ src: url, type: detectType(url) });
  playerInstance.load();
  const p = playerInstance.play();
  if (p && p.catch) p.catch(() => {});
}

function doClosePlayer(){
  document.getElementById('playerModal').classList.remove('active');
  document.body.classList.remove('playing');
  document.querySelectorAll('.channel-card.playing').forEach(c => c.classList.remove('playing'));
  playerInstance.pause();
  playerInstance.reset(); // fully stops the stream so it stops downloading in background
  window.currentIdx = null;
  playerOpen = false;
}
// X button / Escape: agar history entry push hui thi to back() chalao, popstate player band karega
function closePlayer(){
  if (!playerOpen) return;
  if (pushedState) { pushedState = false; history.back(); }
  else doClosePlayer();
}
// Phone/browser Back button: pehle player band hoga, dobara back dabane par page wapis jayega
window.addEventListener('popstate', () => { if (playerOpen) { pushedState = false; doClosePlayer(); } });

function markDead(i){
  dead.add(i);
  const c = document.querySelector('.channel-card[data-i="'+i+'"]'); if (c) c.classList.add('dead');
}

/* ---- AUTO background colour: image ke kinaron ka sab se zyada aane wala rang (index.html se) ---- */
const bgColorCache = {};
function applyAutoBg(wrap, url){
  if (!url) return;
  const paint = (rgb) => {
    wrap.style.backgroundColor = rgb;
    const blurImg = wrap.querySelector('.thumb-bg');
    if (blurImg) blurImg.style.display = 'none';
  };
  if (bgColorCache[url]) { paint(bgColorCache[url]); return; }
  const probe = new Image();
  probe.crossOrigin = 'anonymous';
  probe.onload = () => {
    try {
      const S = 40;
      const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(probe, 0, 0, S, S);
      const d = ctx.getImageData(0, 0, S, S).data;
      const buckets = {}; let best = null, bestCount = 0, opaque = 0;
      const take = (x, y) => {
        const i = (y * S + x) * 4;
        if (d[i + 3] < 40) return;
        opaque++;
        const key = (d[i] >> 5) + ',' + (d[i + 1] >> 5) + ',' + (d[i + 2] >> 5);
        const b = buckets[key] || (buckets[key] = { n: 0, r: 0, g: 0, b: 0 });
        b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2];
        if (b.n > bestCount) { bestCount = b.n; best = b; }
      };
      for (let k = 0; k < S; k++) { take(k, 0); take(k, S - 1); take(0, k); take(S - 1, k); }
      if (!best || opaque < S) return;
      const rgb = `rgb(${Math.round(best.r / best.n)},${Math.round(best.g / best.n)},${Math.round(best.b / best.n)})`;
      bgColorCache[url] = rgb; paint(rgb);
    } catch (e) { /* CORS block: blur wala background hi chalega */ }
  };
  probe.src = url;
}

/* ---------------- GRID ---------------- */
function initials(n){return (n.replace(/[^A-Za-z0-9 ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('')||'?').toUpperCase();}

function buildCard(i){
  const c = CHANNELS[i];
  const card = document.createElement('div');
  card.className = 'channel-card' + (dead.has(i) ? ' dead' : '');
  card.dataset.i = i;
  card.setAttribute('role','button'); card.tabIndex = 0;
  card.innerHTML = `
    <div class="thumb-wrap"></div>
    <div class="channel-logo-text">${esc(c.n)}</div>
    <div class="channel-footer">
      <span class="live-badge">LIVE</span>
      <span class="view-count">${esc(c.q || 'Online')}</span>
    </div>`;
  const wrap = card.querySelector('.thumb-wrap');
  const fallback = () => { wrap.innerHTML = '<div class="ini">'+esc(initials(c.n))+'</div>'; wrap.style.backgroundColor='#111827'; };
  if (!c.l) fallback();
  else {
    wrap.innerHTML = `<img src="${safeImg(c.l)}" class="thumb-bg" alt="" referrerpolicy="no-referrer"><img src="${safeImg(c.l)}" class="card-thumb" loading="lazy" alt="" referrerpolicy="no-referrer">`;
    const px = 'https://wsrv.nl/?url=' + encodeURIComponent(c.l.replace(/^https?:\/\//,'')) + '&w=200';
    wrap.querySelectorAll('img').forEach(im => {
      let retried = false;
      im.onerror = () => { if (!retried) { retried = true; im.src = px; } else fallback(); };
    });
    applyAutoBg(wrap, c.l);
  }
  return card;
}

function render(){
  const t = term.trim().toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  let n = 0;
  CHANNELS.forEach((c,i) => {
    if (cat !== 'All' && !c.g.includes(cat)) return;
    if (t && !c.n.toLowerCase().includes(t)) return;
    frag.appendChild(buildCard(i)); n++;
  });
  grid.appendChild(frag);
  if (!CHANNELS.length) { showLoader(); document.getElementById('count').textContent = ''; return; }
  if (!n) grid.innerHTML = '<div class="empty-msg">No channels found.</div>';
  document.getElementById('count').textContent = n + ' of ' + CHANNELS.length + ' channels';
}

function buildChips(){
  const counts = {};
  CHANNELS.forEach(c => c.g.forEach(g => counts[g] = (counts[g]||0)+1));
  const names = ['All', ...Object.keys(counts).sort((a,b)=>((b==='Pakistan')-(a==='Pakistan'))||(counts[b]-counts[a]))];
  const box = document.getElementById('chips');
  box.innerHTML = '';
  names.forEach(n => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = n === 'All' ? 'All' : n + ' ' + counts[n];
    b.setAttribute('aria-pressed', n === cat);
    b.onclick = () => { cat = n; [...box.children].forEach((x,k)=>x.setAttribute('aria-pressed', names[k]===cat)); render(); };
    box.appendChild(b);
  });
}


/* ---------------- PLAYLIST LOADER ---------------- */
const STORE_KEY = 'sprtix_news_playlist';

function parseM3U(text){
  const lines = String(text).split(/\r?\n/), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim();
    if (!l.startsWith('#EXTINF')) continue;
    const m = l.match(/,([^,]*)$/);                       // naam hamesha aakhri comma ke baad hota hai
    let name = (m ? m[1] : '').trim();
    const logo = (l.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
    const grp  = (l.match(/group-title="([^"]*)"/) || [])[1] || '';
    let j = i + 1;
    while (j < lines.length && lines[j].trim() && lines[j].trim().startsWith('#') && !lines[j].trim().startsWith('#EXTINF')) j++;
    while (j < lines.length && !lines[j].trim()) j++;
    const url = (lines[j] || '').trim();
    if (!url || url.startsWith('#')) continue;            // URL missing: is entry ko chor do
    let tag = '';
    name = name.replace(/\s*\[([^\]]+)\]\s*/g, (_, t) => { tag = t; return ' '; }).trim();
    const q = name.match(/\s*\(([^)]*\d+[pi])\)\s*$/);
    let quality = '';
    if (q) { quality = q[1]; name = name.slice(0, q.index).trim(); }
    if (!name) continue;
    const g = grp.split(';').map(x => x.trim()).filter(Boolean);
    out.push({ n: name, l: logo, g: g.length ? g : ['Other'], q: /geo/i.test(tag) ? 'Geo-blocked' : (quality || ''), u: url });
    i = j;
  }
  return out;
}

function setPlaylist(text, save){
  const list = parseM3U(text);
  if (!list.length) { showToast('Is file mein koi channel nahi mila (#EXTINF lines chahiye)'); return false; }
  CHANNELS = list; cat = 'All'; term = ''; dead.clear();
  document.getElementById('searchInput').value = '';
  buildChips(); render();
  if (save) { try { localStorage.setItem(STORE_KEY, text); } catch (e) {} }
  showToast(list.length + ' channels loaded');
  return true;
}

function showLoader(){
  const grid = document.getElementById('grid');
  grid.innerHTML = `
    <div class="loader">
      <h3>News playlist load karein</h3>
      <p>Apni news playlist (.m3u / .txt) select karein ya neeche paste karein. Ek baar load karne ke baad ye browser mein save rehti hai.</p>
      <button class="go" type="button" id="pickBtn">Playlist file select karein</button>
      <textarea id="pasteBox" placeholder="#EXTM3U ... yahan paste karein"></textarea>
      <button class="go alt" type="button" id="pasteBtn">Paste se load karein</button>
    </div>`;
  document.getElementById('pickBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('pasteBtn').onclick = () => setPlaylist(document.getElementById('pasteBox').value, true);
}

function openChannel(card){
  const i = +card.dataset.i, c = CHANNELS[i];
  dead.delete(i); card.classList.remove('dead');
  window.currentIdx = i;
  document.querySelectorAll('.channel-card.playing').forEach(x => x.classList.remove('playing'));
  card.classList.add('playing');
  playStream(c.u, c.n);
}

window.addEventListener('DOMContentLoaded', () => {
  try { initPlayer(); } catch (e) { console.error(e); try { useVjs = false; initHlsPlayer(); } catch (e2) {} }
  document.getElementById('fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => setPlaylist(r.result, true); r.readAsText(f); e.target.value = '';
  });
  if (!CHANNELS.length) {
    try { const saved = localStorage.getItem(STORE_KEY); if (saved) CHANNELS = parseM3U(saved); } catch (e) {}
  }
  buildChips();
  render();

  const grid = document.getElementById('grid');
  grid.addEventListener('click', e => { const c = e.target.closest('.channel-card'); if (c) openChannel(c); });
  grid.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const c = e.target.closest('.channel-card'); if (c) { e.preventDefault(); openChannel(c); } } });
  let st; document.getElementById('searchInput').addEventListener('input', e => { term = e.target.value; clearTimeout(st); st = setTimeout(render, 120); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
});
</script>
