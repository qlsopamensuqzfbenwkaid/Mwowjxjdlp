name: Send OneSignal Push
on:
  workflow_dispatch:
    inputs:
      title:
        description: Title
        required: true
      message:
        description: Message
        required: true
      url:
        description: Open URL (optional)
        required: false
        default: ""
      image:
        description: Big image URL (optional)
        required: false
        default: ""
permissions: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send push
        env:
          ONESIGNAL_APP_ID: 3a4a7c9f-13ad-4393-b554-4ed3d1b1db7d
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TITLE: ${{ inputs.title }}
          MESSAGE: ${{ inputs.message }}
          URL: ${{ inputs.url }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$1"; { echo "### Push fail"; echo "$1"; } >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          [ -n "${ONESIGNAL_API_KEY:-}" ] || fail "Secret ONESIGNAL_REST_API_KEY is repo (Mwowjxjdlp) me set nahi hai"
          if printf '%s' "$ONESIGNAL_API_KEY" | grep -q '[[:space:]]'; then fail "Key me space ya nayi line hai. Secret dobara paste karein"; fi
          case "$ONESIGNAL_API_KEY" in
            os_v2_app_*) schemes="Key"; kfmt="nayi App API key" ;;
            os_v2_org_*) fail "Ye ORGANIZATION key hai, is se push nahi jati. OneSignal > Settings > Keys & IDs me is app ki App API Key banayein" ;;
            *) schemes="Basic Key"; kfmt="purani REST API key" ;;
          esac
          echo "Key: $kfmt, length ${#ONESIGNAL_API_KEY}"
          echo "Key: $kfmt, length ${#ONESIGNAL_API_KEY}" >> "$GITHUB_STEP_SUMMARY"
          id=""; last=""
          for scheme in $schemes; do
            for seg in "Subscribed Users" "Total Subscriptions" "Active Subscriptions"; do
              body=$(jq -n --arg app "$ONESIGNAL_APP_ID" --arg seg "$seg" --arg t "$TITLE" --arg m "$MESSAGE" --arg u "$URL" --arg i "$IMAGE" \
                '{app_id:$app, target_channel:"push", included_segments:[$seg], headings:{en:$t}, contents:{en:$m}} + (if $u != "" then {url:$u} else {} end) + (if $i != "" then {big_picture:$i} else {} end)')
              code=$(curl -sS -o resp.json -w '%{http_code}' -X POST https://api.onesignal.com/notifications \
                -H "Content-Type: application/json" -H "Authorization: $scheme $ONESIGNAL_API_KEY" -d "$body" || echo 000)
              echo "[$scheme] segment '$seg' -> HTTP $code"
              jq -c . resp.json 2>/dev/null || cat resp.json
              id=$(jq -r '.id // empty' resp.json 2>/dev/null || true)
              [ -n "$id" ] && break 2
              last="[$scheme] HTTP $code: $(jq -c '.errors // .' resp.json 2>/dev/null || cat resp.json)"
              case "$code" in 401|403) break ;; esac
            done
          done
          if [ -z "$id" ]; then
            hint=""
            case "$last" in
              *"HTTP 401"*|*"HTTP 403"*) hint=" | Ye key is app (3a4a7c9f...) ke liye valid nahi: nayi App API Key banayein (IP allowlist khali rakhein) aur secret dobara daalein" ;;
              *ot\ subscribed*|*o\ subscribed*) hint=" | Koi device subscribed nahi: OneSignal > Audience > Subscriptions dekhein" ;;
            esac
            fail "OneSignal ne push nahi bheja. $last$hint"
          fi
          echo "Notification ID: $id"
          echo "### Push bheji gayi: $id" >> "$GITHUB_STEP_SUMMARY"
          sleep 12
          curl -sS "https://api.onesignal.com/notifications/$id?app_id=$ONESIGNAL_APP_ID" -H "Authorization: $scheme $ONESIGNAL_API_KEY" -o stat.json || true
          jq '{successful, failed, errored, remaining, converted}' stat.json 2>/dev/null || cat stat.json
          ok=$(jq -r '.successful // 0' stat.json 2>/dev/null || echo 0)
          if [ "$ok" = "0" ]; then echo "::warning::Abhi tak kisi device ko push nahi gayi (subscription ya FCM check karein)"; fi
